<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EXP 差異比對工具</title>
</head>
<body>
    <h2>EXP 差異比對工具</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>上傳舊版 EXP 檔案：</label>
        <input type="file" name="file1" required><br><br>

        <label>上傳新版 EXP 檔案：</label>
        <input type="file" name="file2" required><br><br>

        <label>選擇主鍵欄位：</label>
        <select name="primary_key" required>
            <option value="ID">ID</option>
            <option value="Part Reference">Part Reference</option>
            <option value="Net Name">Net Name</option>
        </select><br><br>

        <input type="checkbox" name="ignore_case"> 忽略大小寫與空白<br><br>

        <input type="submit" value="執行比對並下載報告">
    </form>
</body>
</html>
